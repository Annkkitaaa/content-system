# Posting cadence and timing.
#
# Slots are spread across the named windows rather than pinned to fixed
# times. Each slot then gets a random offset up to `jitter_minutes`, because
# machine-regular posting timing is a demotion signal on X: the ranking model
# profiles accounts for human-plausible behaviour.

x:
  posts_per_day: 10
  jitter_minutes: 13
  min_gap_minutes: 35
  windows:
    - name: morning
      start: "08:00"
      end: "10:30"
      weight: 2
    - name: late_morning
      start: "10:30"
      end: "13:00"
      weight: 2
    - name: afternoon
      start: "13:00"
      end: "17:00"
      weight: 2
    - name: evening
      start: "17:00"
      end: "21:00"
      weight: 3
    - name: night
      start: "21:00"
      end: "23:30"
      weight: 1

linkedin:
  posts_per_week: 2
  jitter_minutes: 20
  min_gap_minutes: 1440
  preferred_days:
    - Tuesday
    - Thursday
  windows:
    - name: mid_morning
      start: "09:30"
      end: "11:30"
      weight: 1
