[project]
name = "contentsys"
version = "0.1.0"
description = "A personal content system that turns your own knowledge, opinions and experiences into authentic X and LinkedIn drafts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "typer>=0.15",
    "rich>=13.9",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
# The Messages API provider. Not needed when running on the Agent SDK.
api = ["anthropic>=0.69"]
# The Agent SDK provider. Runs on a Claude subscription, no API key.
agent = ["claude-agent-sdk>=0.1.0"]
# The dashboard backend, added in a later phase.
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
contentsys = "contentsys.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contentsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Ambiguous-unicode checks fight with the house style linter, which owns
    # punctuation policy for this repo. See tools/check_style.py.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["contentsys"]
